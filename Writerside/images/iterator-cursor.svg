<rect x="448" y="386" width="96" height="32" rx="16" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="496" y="407" fill="#1a7f37" font-size="15" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace">→ C</text>
<text x="560" y="399" fill="#d1242f" font-size="13.5" font-weight="600" text-anchor="start" font-family="'JetBrains Mono', Menlo, Consolas, monospace">hasNext() = false</text>
<text x="560" y="418" fill="#59636e" font-size="13" font-weight="400" text-anchor="start" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">C 를 반환, 끝</text>
