<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470">
<rect width="760" height="470" rx="12" fill="#ffffff"/>
<text x="28" y="38" fill="#1f2328" font-size="19" font-weight="700" text-anchor="start" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">Iterator 의 커서 위치</text>
<text x="28" y="62" fill="#59636e" font-size="13.5" font-weight="400" text-anchor="start" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">커서(▼)는 요소 사이에 있고, next() 는 커서 바로 뒤 요소를 돌려준 뒤 그 요소 뒤로 넘어갑니다.</text>
<text x="28" y="138" fill="#1f2328" font-size="15" font-weight="600" text-anchor="start" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">처음</text>
